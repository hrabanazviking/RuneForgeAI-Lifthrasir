---
modules-search: [ local ]
instances: []
sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - pkgselect
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - initramfscfg
    - initramfs
    - grubcfg
    - bootloader
    - automirror
    - packages
    - umount
  - show:
    - finished
branding: kubuntu
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: true
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: true
